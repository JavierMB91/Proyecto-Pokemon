<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeMMO - Pokédex Demo</title>

    <!-- SEO & Metadata -->
    <meta name="description" content="Herramientas y trackers para PokeMMO. Gestiona tus gimnasios, bayas, rotaciones de legendarios y explora la Pokédex.">
    <meta name="keywords" content="PokeMMO, Tracker, Pokemon, Gym, Legendary, Berries, Semillas, Rotacion, Battle, Pokedex, Gimnasios, Legendarios">
    <meta name="author" content="TuNombre (Reemplazar)">
    <meta name="theme-color" content="#4527a0">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="URL_A_REEMPLAZAR">
    <meta property="og:title" content="PokeMMO - Pokédex Demo">
    <meta property="og:description" content="Herramientas y trackers para PokeMMO. Gestiona tus gimnasios, bayas, rotaciones de legendarios y explora la Pokédex.">
    <meta property="og:image" content="URL_A_REEMPLAZAR/api/favicon/android-chrome-512x512.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="URL_A_REEMPLAZAR">
    <meta property="twitter:title" content="PokeMMO - Pokédex Demo">
    <meta property="twitter:description" content="Herramientas y trackers para PokeMMO. Gestiona tus gimnasios, bayas, rotaciones de legendarios y explora la Pokédex.">
    <meta property="twitter:image" content="URL_A_REEMPLAZAR/api/favicon/android-chrome-512x512.png">

    <!-- Favicons (desde la carpeta /api/favicon/) -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <link rel="mask-icon" href="favicon/safari-pinned-tab.svg" color="#673ab7">
    <meta name="msapplication-TileColor" content="#673ab7">

    <!-- Enlace al archivo CSS externo -->
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <header>
        <h1>Pokédex (Datos Externos)</h1>
    </header>

    <!-- Aquí se cargará nav.html -->
    <div id="nav-placeholder"></div>

    <div class="container" style="margin-bottom: 0;">
        <div class="pokedex-search-container">
            <input type="text" id="poke-search" class="modal-input" placeholder="🔍 Buscar Pokémon por nombre..." style="margin: 0; border-radius: 30px; padding-left: 20px; border-color: var(--dark-purple); background-color: rgba(30, 26, 46, 0.9);">
        </div>
    </div>

    <div class="container">
        <div class="region-card wide-card">
            <div class="region-header">
                <span style="flex-grow: 1; text-align: center;">Lista de Pokémon</span>
            </div>
            
            <div class="pokedex-grid" id="pokedex-container">
                <div class="loading-msg">Conectando con GitHub y descargando datos...</div>
            </div>
        </div>
    </div>

    <!-- Aquí se cargará footer.html -->
    <div id="footer-placeholder"></div>

    <!-- Modal de Detalles del Pokémon -->
    <div class="modal-overlay" id="pokedex-modal">
        <div class="modal-content pokedex-modal-content">
            <div class="poke-header">
                <h2 id="modal-poke-name">Nombre</h2>
                <div class="poke-types" id="modal-poke-types"></div>
            </div>
            <div id="modal-poke-description" class="poke-description" style="display: none;"></div>
            <div class="poke-body">
                <div class="poke-info-col" id="modal-poke-stats"></div>
                <div class="poke-info-col moves-table-container">
                    <table class="moves-table" id="modal-poke-moves"></table>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-modal btn-confirm" onclick="document.getElementById('pokedex-modal').classList.remove('active')">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/transiciones.js"></script>
    <!-- state.js inicia la descarga de datosPokemons automáticamente -->
    <script src="../js/state.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>

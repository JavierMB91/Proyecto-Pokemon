<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeMMO - Pokédex Demo</title>
    <!-- Enlace al archivo CSS externo -->
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <header>
        <h1>Pokédex (Datos Externos)</h1>
    </header>

    <!-- Aquí se cargará nav.html -->
    <div id="nav-placeholder"></div>

    <div class="container" style="margin-bottom: 0;">
        <div class="pokedex-search-container">
            <input type="text" id="poke-search" class="modal-input" placeholder="🔍 Buscar Pokémon por nombre..." style="margin: 0; border-radius: 30px; padding-left: 20px; border-color: var(--dark-purple); background-color: rgba(30, 26, 46, 0.9);">
        </div>
    </div>

    <div class="container" id="pokedex-container">
        <div class="region-card wide-card">
            <div class="region-header">
                <span style="flex-grow: 1; text-align: center;">Cargando Pokédex...</span>
            </div>
            
            <div class="pokedex-grid">
                <div class="loading-msg">Conectando con GitHub y descargando datos...</div>
            </div>
        </div>
    </div>

    <!-- Aquí se cargará footer.html -->
    <div id="footer-placeholder"></div>

    <!-- Modal de Detalles del Pokémon -->
    <div class="modal-overlay" id="pokedex-modal">
        <div class="modal-content pokedex-modal-content">
            <div class="poke-header">
                <h2 id="modal-poke-name">Nombre</h2>
                <div class="poke-types" id="modal-poke-types"></div>
            </div>
            <div id="modal-poke-description" class="poke-description" style="display: none;"></div>
            <div class="poke-body">
                <div class="poke-info-col" id="modal-poke-stats"></div>
                <div class="poke-info-col moves-table-container">
                    <table class="moves-table" id="modal-poke-moves"></table>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-modal btn-confirm" onclick="document.getElementById('pokedex-modal').classList.remove('active')">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/transiciones.js"></script>
    <!-- state.js inicia la descarga de datosPokemons automáticamente -->
    <script src="../js/state.js"></script>
    <script src="../js/ui.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof cargarNavegacion === 'function') cargarNavegacion();

            const container = document.getElementById('pokedex-container');
            
            // Colores de tipos para los badges
            const typeColors = {
                normal: '#A8A77A',
                fire: '#EE8130',
                water: '#6390F0',
                electric: '#F7D02C',
                grass: '#7AC74C',
                ice: '#96D9D6',
                fighting: '#C22E28',
                poison: '#A33EA1',
                ground: '#E2BF65',
                flying: '#A98FF3',
                psychic: '#F95587',
                bug: '#A6B91A',
                rock: '#B6A136',
                ghost: '#735797',
                dragon: '#6F35FC',
                dark: '#705746',
                steel: '#B7B7CE',
                fairy: '#D685AD'
            };
            
            // Evento del buscador
            const searchInput = document.getElementById('poke-search');
            searchInput.addEventListener('input', (e) => {
                const termino = e.target.value.toLowerCase();
                renderizarPokedex(termino);
            });

            // Esperamos a que state.js termine de descargar los datos
            const intervalo = setInterval(() => {
                // Verificamos si la variable global datosPokemons ya tiene datos
                if (typeof datosPokemons !== 'undefined' && Object.keys(datosPokemons).length > 0) {
                    clearInterval(intervalo);
                    renderizarPokedex();
                }
            }, 200); // Revisar cada 200ms

            function renderizarPokedex(filtro = '') {
                container.innerHTML = '';
                
                // Convertimos los datos a array (si vienen como objeto con claves ID)
                let lista = Array.isArray(datosPokemons) ? datosPokemons : Object.values(datosPokemons);
                
                // Ordenamos por ID
                lista.sort((a, b) => (a.id || 0) - (b.id || 0));

                // Aplicar filtro de búsqueda si existe
                if (filtro) {
                    lista = lista.filter(p => {
                        let nombre = p.name;
                        if (typeof p.name === 'object' && p.name.en) nombre = p.name.en;
                        if (!nombre) nombre = "";
                        return nombre.toLowerCase().includes(filtro) || String(p.id).includes(filtro);
                    });
                }

                // Definimos las regiones y sus rangos de ID
                const regiones = [
                    { nombre: 'Kanto', min: 1, max: 151 },
                    { nombre: 'Johto', min: 152, max: 251 },
                    { nombre: 'Hoenn', min: 252, max: 386 },
                    { nombre: 'Sinnoh', min: 387, max: 493 },
                    { nombre: 'Teselia', min: 494, max: 649 }
                ];

                regiones.forEach((region, index) => {
                    // Filtramos los Pokémon que pertenecen a esta región
                    const pokemonsRegion = lista.filter(p => {
                        const id = p.id || 0;
                        return id >= region.min && id <= region.max;
                    });

                    if (pokemonsRegion.length === 0) return;

                    // Creamos la tarjeta de la región (estilo acordeón)
                    const regionCard = document.createElement('div');
                    regionCard.className = 'region-card wide-card';
                    
                    // Si hay búsqueda activa, expandimos todo. Si no, colapsamos por defecto.
                    if (!filtro) regionCard.classList.add('collapsed');

                    // Cabecera con el nombre y el icono
                    const header = document.createElement('div');
                    header.className = 'region-header';
                    header.innerHTML = `
                        <span style="flex-grow: 1; text-align: center;">${region.nombre} (${pokemonsRegion.length})</span>
                        <span class="toggle-icon">▼</span>
                    `;
                    // Lógica de colapso
                    header.onclick = () => {
                        regionCard.classList.toggle('collapsed');
                        // Si la tarjeta se abre (no está colapsada), la centramos en pantalla con un pequeño retraso
                        if (!regionCard.classList.contains('collapsed')) {
                            setTimeout(() => {
                                regionCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            }, 300);
                        }
                    };

                    // Contenedor Grid para los Pokémon
                    const grid = document.createElement('div');
                    grid.className = 'pokedex-grid';

                    pokemonsRegion.forEach((p, index) => {
                        let nombre = p.name;
                        if (typeof p.name === 'object' && p.name.en) nombre = p.name.en;
                        if (!nombre) nombre = "Desconocido";

                        const id = p.id || 0;
                        const imgUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;

                        const card = document.createElement('div');
                        card.className = 'pokemon-card';
                        card.style.cursor = 'pointer';
                        card.style.animationDelay = `${index * 0.02}s`; // Efecto cascada fluido
                        card.onclick = () => abrirModalPokemon(p);
                        card.innerHTML = `
                            <div class="pokemon-id">#${id}</div>
                            <img src="${imgUrl}" class="pokemon-image" alt="${nombre}" loading="lazy" onerror="this.style.display='none'">
                            <div class="pokemon-name">${nombre}</div>
                        `;
                        grid.appendChild(card);
                    });

                    regionCard.appendChild(header);
                    regionCard.appendChild(grid);
                    container.appendChild(regionCard);
                });
            }

            // Función para abrir el modal con detalles
            window.abrirModalPokemon = function(pokemon) {
                const modal = document.getElementById('pokedex-modal');
                
                // 1. Datos Básicos
                let nombre = pokemon.name;
                if (typeof pokemon.name === 'object' && pokemon.name.en) nombre = pokemon.name.en;
                document.getElementById('modal-poke-name').textContent = `#${pokemon.id} ${nombre}`;

                // 2. Tipos
                const typesContainer = document.getElementById('modal-poke-types');
                typesContainer.innerHTML = '';
                if (pokemon.type) {
                    // A veces viene como array de strings o array de objetos
                    const types = Array.isArray(pokemon.type) ? pokemon.type : [pokemon.type];
                    types.forEach(t => {
                        const typeName = (typeof t === 'string' ? t : t.name).toLowerCase();
                        const badge = document.createElement('span');
                        badge.className = 'type-badge';
                        badge.style.backgroundColor = typeColors[typeName] || '#777';
                        badge.textContent = typeName;
                        typesContainer.appendChild(badge);
                    });
                }

                // 2.5 Descripción (Nueva funcionalidad desde pokedex.json)
                const descContainer = document.getElementById('modal-poke-description');
                
                // Función robusta para encontrar descripción en cualquier estructura
                const findDescription = (obj) => {
                    if (!obj) return null;
                    
                    // 1. Propiedades directas conocidas
                    const candidates = [
                        obj.description, obj.desc, obj.flavor_text, obj.entry, obj.pokedex_entry, obj.info
                    ];
                    
                    for (const candidate of candidates) {
                        if (candidate) {
                            if (typeof candidate === 'string' && candidate.length > 10) return candidate;
                            if (typeof candidate === 'object') {
                                // Preferencia: Español > Inglés > Primero que encuentre
                                if (candidate.es) return candidate.es;
                                if (candidate.en) return candidate.en;
                                const values = Object.values(candidate);
                                if (values.length > 0 && typeof values[0] === 'string') return values[0];
                            }
                            if (Array.isArray(candidate) && candidate.length > 0 && typeof candidate[0] === 'string') {
                                return candidate.join(' ');
                            }
                        }
                    }

                    // 2. Búsqueda recursiva superficial (para propiedades no estándar)
                    for (const key in obj) {
                        // Ignorar claves técnicas
                        if (['name', 'url', 'image', 'img', 'sprite', 'icon', 'type', 'stats', 'moves', 'baseStats', 'id', 'evolution'].includes(key)) continue;
                        
                        const val = obj[key];
                        if (typeof val === 'string' && val.length > 20) return val; // String largo = probable descripción
                        if (typeof val === 'object' && val !== null && !Array.isArray(val)) {
                            if (val.es && typeof val.es === 'string') return val.es;
                            if (val.en && typeof val.en === 'string') return val.en;
                        }
                    }
                    
                    return null;
                };

                // Intentamos buscar en datos extra primero, luego en el pokemon mismo
                const extraData = datosPokedexExtra[pokemon.id] || datosPokedexExtra[String(pokemon.id)];
                let descText = findDescription(extraData);
                
                // Si no encontramos en extraData, buscamos en el propio pokemon
                if (!descText) {
                    descText = findDescription(pokemon);
                }

                if (descText) {
                    descContainer.textContent = descText;
                    descContainer.style.display = 'block';
                } else {
                    // Fallback visual si no hay descripción
                    descContainer.textContent = "Descripción no disponible en la base de datos.";
                    descContainer.style.display = 'block';
                    descContainer.style.opacity = '0.5';
                }

                // 3. Stats y Sprite
                const statsContainer = document.getElementById('modal-poke-stats');
                const imgUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pokemon.id}.png`;
                
                // Mapeo de nombres de stats (ajustar según venga en el JSON)
                // PokeMMO data suele usar: hp, att, def, sp_att, sp_def, speed
                const statsMap = {
                    'HP': pokemon.stats?.hp || pokemon.baseStats?.hp || 0,
                    'Ataque': pokemon.stats?.att || pokemon.baseStats?.atk || 0,
                    'Defensa': pokemon.stats?.def || pokemon.baseStats?.def || 0,
                    'Atq. Esp': pokemon.stats?.sp_att || pokemon.baseStats?.spa || 0,
                    'Def. Esp': pokemon.stats?.sp_def || pokemon.baseStats?.spd || 0,
                    'Velocidad': pokemon.stats?.speed || pokemon.baseStats?.spe || 0
                };

                let statsHtml = `<img src="${imgUrl}" class="poke-sprite-large" alt="${nombre}">`;
                for (const [label, val] of Object.entries(statsMap)) {
                    const percent = Math.min(100, (val / 255) * 100); // 255 es aprox el max base stat
                    statsHtml += `
                        <div class="stat-row">
                            <span class="stat-label">${label}</span>
                            <span class="stat-val">${val}</span>
                            <div class="stat-bar-bg">
                                <div class="stat-bar-fill" style="width: ${percent}%; background-color: ${val > 100 ? '#00e676' : (val < 50 ? '#e53935' : 'var(--light-purple)')}"></div>
                            </div>
                        </div>
                    `;
                }
                statsContainer.innerHTML = statsHtml;

                // 4. Movimientos
                const movesTable = document.getElementById('modal-poke-moves');
                movesTable.innerHTML = `
                    <thead>
                        <tr>
                            <th>Nivel</th>
                            <th>Movimiento</th>
                            <th>Tipo</th>
                            <th>Poder</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                `;
                const tbody = movesTable.querySelector('tbody');

                let levelMoves = [];
                if (pokemon.moves && Array.isArray(pokemon.moves)) {
                    levelMoves = pokemon.moves.filter(m => m.method === 1 || m.level > 0).sort((a, b) => a.level - b.level);
                }

                if (levelMoves.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 20px;">No hay datos de movimientos disponibles.</td></tr>';
                } else {
                    // ESTRATEGIA DE RENDIMIENTO HÍBRIDA:
                    // 1. Renderizamos los primeros 15 movimientos INMEDIATAMENTE (lo que cabe en pantalla).
                    // Esto elimina el "lag" de espera y el usuario ve datos al instante.
                    const INITIAL_BATCH = 15;
                    const firstBatch = levelMoves.slice(0, INITIAL_BATCH);
                    
                    // Función auxiliar para generar HTML de una fila (para no repetir código)
                    const generateRowHtml = (m) => {
                        const moveDetail = datosMovimientos[m.id];
                        const moveName = moveDetail ? (moveDetail.name.en || moveDetail.name) : `ID: ${m.id}`;
                        const moveType = moveDetail ? moveDetail.type.toLowerCase() : '-';
                        const movePower = moveDetail ? (moveDetail.power || '-') : '-';
                        const typeColor = typeColors[moveType] || 'transparent';
                        
                        return `<tr>
                            <td>${m.level}</td>
                            <td>${moveName}</td>
                            <td><span class="type-badge" style="background-color: ${typeColor}; font-size: 0.7rem; padding: 2px 6px;">${moveType}</span></td>
                            <td>${movePower}</td>
                        </tr>`;
                    };

                    // Insertamos el primer lote ya
                    tbody.innerHTML = firstBatch.map(generateRowHtml).join('');

                    // 2. Si hay más movimientos, los renderizamos DESPUÉS de que termine la animación de apertura.
                    // Así la animación es fluida y el resto de datos aparecen transparentemente.
                    if (levelMoves.length > INITIAL_BATCH) {
                        setTimeout(() => {
                            const remainingMoves = levelMoves.slice(INITIAL_BATCH);
                            // Usamos requestAnimationFrame para insertar el resto en un momento inactivo
                            requestAnimationFrame(() => {
                                const remainingHtml = remainingMoves.map(generateRowHtml).join('');
                                tbody.insertAdjacentHTML('beforeend', remainingHtml);
                            });
                        }, 400); // 300ms transición + margen
                    }
                }

                modal.classList.add('active');
            };

            // Timeout de seguridad por si falla la carga
            setTimeout(() => {
                if (container.querySelector('.loading-msg')) {
                    clearInterval(intervalo);
                    container.innerHTML = '<div class="region-card wide-card"><div class="pokedex-grid"><div class="loading-msg" style="color: var(--poke-red)">No se pudieron cargar los datos. Revisa la consola (F12).</div></div></div>';
                }
            }, 10000); // 10 segundos máximo
        });
    </script>
</body>
</html>

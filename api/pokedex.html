<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeMMO - Pokédex Demo</title>
    <!-- Enlace al archivo CSS externo -->
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <header>
        <h1>Pokédex (Datos Externos)</h1>
    </header>

    <!-- Aquí se cargará nav.html -->
    <div id="nav-placeholder"></div>

    <div class="container" style="margin-bottom: 0;">
        <div class="pokedex-search-container">
            <input type="text" id="poke-search" class="modal-input" placeholder="🔍 Buscar Pokémon por nombre..." style="margin: 0; border-radius: 30px; padding-left: 20px; border-color: var(--dark-purple); background-color: rgba(30, 26, 46, 0.9);">
        </div>
    </div>

    <div class="container">
        <div class="region-card wide-card">
            <div class="region-header">
                <span style="flex-grow: 1; text-align: center;">Lista de Pokémon</span>
            </div>
            
            <div class="pokedex-grid" id="pokedex-container">
                <div class="loading-msg">Conectando con GitHub y descargando datos...</div>
            </div>
        </div>
    </div>

    <!-- Aquí se cargará footer.html -->
    <div id="footer-placeholder"></div>

    <!-- Modal de Detalles del Pokémon -->
    <div class="modal-overlay" id="pokedex-modal">
        <div class="modal-content pokedex-modal-content">
            <div class="poke-header">
                <h2 id="modal-poke-name">Nombre</h2>
                <div class="poke-types" id="modal-poke-types"></div>
            </div>
            <div id="modal-poke-description" class="poke-description" style="display: none;"></div>
            <div class="poke-body">
                <div class="poke-info-col" id="modal-poke-stats"></div>
                <div class="poke-info-col moves-table-container">
                    <table class="moves-table" id="modal-poke-moves"></table>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-modal btn-confirm" onclick="document.getElementById('pokedex-modal').classList.remove('active')">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/transiciones.js"></script>
    <!-- state.js inicia la descarga de datosPokemons automáticamente -->
    <script src="../js/state.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/pokedex.js"></script>
</body>
</html>

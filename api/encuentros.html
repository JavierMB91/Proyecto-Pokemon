<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeMMO Nº Encuentros</title>
    <!-- Enlace al archivo CSS externo -->
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <header>
        <h1>Nº Encuentros</h1>
    </header>

    <!-- Aquí se cargará nav.html -->
    <div id="nav-placeholder"></div>

    <div class="reset-container">
        <button class="btn-reset" id="btn-reset">Reiniciar Progreso</button>
    </div>

    <div class="container" id="app">
        <!-- El contenido se generará dinámicamente con JS -->
    </div>

    <!-- Aquí se cargará footer.html -->
    <div id="footer-placeholder"></div>

    <!-- Modal de Confirmación Reset -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <h3>¿Reiniciar Progreso?</h3>
            <p>¿Estás seguro de que quieres borrar todo el progreso?</p>
            <div class="modal-actions">
                <button class="btn-modal btn-cancel" id="modal-cancel">Cancelar</button>
                <button class="btn-modal btn-confirm" id="modal-confirm">Sí, reiniciar</button>
            </div>
        </div>
    </div>

    <!-- Modal de Añadir Encuentros -->
    <div class="modal-overlay" id="encounter-modal">
        <div class="modal-content">
            <h3>Añadir Encuentros</h3>
            <p>Introduce cuántos encuentros quieres sumar:</p>
            <input type="number" id="encounter-input" class="modal-input" placeholder="Ej: 50">
            <p id="encounter-error" class="error-message"></p>
            <div class="modal-actions">
                <button class="btn-modal btn-cancel" id="encounter-cancel">Cancelar</button>
                <button class="btn-modal btn-confirm" id="encounter-confirm">Añadir</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/validaciones.js"></script>
    <!-- Script de Transiciones -->
    <script src="../js/transiciones.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeMMO Battle Tracker</title>
    <link rel="icon" href="../img/favicon.png" type="image/png">
    <!-- Enlace al archivo CSS externo -->
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <header>
        <h1>Battle Tracker</h1>
    </header>

    <!-- Aquí se cargará nav.html -->
    <div id="nav-placeholder"></div>

    <div class="container" id="app">
        <!-- El contenido se generará dinámicamente con JS -->
    </div>

    <!-- Aquí se cargará footer.html -->
    <div id="footer-placeholder"></div>

    <!-- Modal de Confirmación -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <h3>¿Reiniciar Progreso?</h3>
            <p>¿Estás seguro de que quieres borrar todo el progreso?</p>
            <div class="modal-actions">
                <button class="btn-modal btn-cancel" id="modal-cancel">Cancelar</button>
                <button class="btn-modal btn-confirm" id="modal-confirm">Sí, reiniciar</button>
            </div>
        </div>
    </div>

    <!-- Script de Transiciones -->
    <script src="../js/transiciones.js"></script>
    <!-- Enlace al archivo JS externo -->
    <script src="../js/script.js"></script>
</body>
</html>
